name: Documentation

# The docs are published as part of the web app, at https://sounderpy.app/docs/ (and a preview of the
# development branch's docs at https://dev.sounderpy.app/docs/). The web app's own workflows build them from
# this repo. This workflow:
#   1. checks the docs still build;
#   2. asks the web app to rebuild, so docs changes go live: `main` -> sounderpy.app, `development` -> dev.sounderpy.app;
#   3. on `main`, publishes this repo's own GitHub Pages site (kylejgillett.github.io/sounderpy/) as redirects to
#      the same pages at sounderpy.app/docs/, so old links keep working.
#
# Needs the repository secret SITE_DEPLOY_TOKEN: a fine-grained personal access token limited to
# kylejgillett/sounderpy-webapp with "Actions: Read and write".

on:
  push:
    branches: [main, development]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r docs/requirements.txt
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Build documentation
        run: sphinx-build -W --keep-going docs/source docs/build/html

      - name: Rebuild the web app, which publishes these docs
        env:
          GH_TOKEN: ${{ secrets.SITE_DEPLOY_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::The SITE_DEPLOY_TOKEN secret isn't set in this repo (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          if [ "${GITHUB_REF_NAME}" = "main" ]; then workflow=deploy.yml; ref=main; else workflow=deploy-dev.yml; ref=dev; fi
          status=$(curl -sS -o response.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/kylejgillett/sounderpy-webapp/actions/workflows/${workflow}/dispatches" \
            -d "{\"ref\": \"${ref}\"}")
          if [ "${status}" = "204" ]; then echo "Started ${workflow} on sounderpy-webapp@${ref}"; exit 0; fi
          cat response.json; echo
          case "${status}" in
            401) echo "::error::GitHub rejected SITE_DEPLOY_TOKEN (401): it's wrong or expired. Make a new token and update the secret." ;;
            403) echo "::error::SITE_DEPLOY_TOKEN can't start workflows (403): give it Repository permissions > Actions: Read and write." ;;
            404) echo "::error::SITE_DEPLOY_TOKEN can't see sounderpy-webapp or ${workflow} (404): add sounderpy-webapp under the token's Repository access." ;;
            422) echo "::error::sounderpy-webapp's ${workflow} can't be started on '${ref}' (422): check that branch exists and its workflow has workflow_dispatch." ;;
            *) echo "::error::Starting the web app rebuild failed with HTTP ${status}." ;;
          esac
          exit 1

      - name: Turn the old docs address into redirects
        if: github.ref_name == 'main'
        run: python docs/make_redirects.py docs/build/html

      - name: Configure GitHub Pages
        if: github.ref_name == 'main'
        uses: actions/configure-pages@v6

      - name: Upload redirects
        if: github.ref_name == 'main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/build/html

  deploy:
    if: github.ref_name == 'main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
